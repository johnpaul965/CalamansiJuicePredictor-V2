name: calamansi_yield_capstone
description: Calamansi Harvest Yield Prediction App (Leyte Normal University Thesis)
version: 2.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2
  intl: ">=0.18.0 <1.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ">=0.13.1 <1.0.0"

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#FFE0B2"
  adaptive_icon_foreground: "assets/icon/app_icon_adaptive.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
